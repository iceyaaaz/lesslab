<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>留白 LessLab</title>
    <style>
        .original-link {
    display: inline-block;
    margin-top: 16px;
    margin-right: 16px;
    color: #315e49;
    font-weight: bold;
    text-decoration: none;
}

.original-link:hover {
    text-decoration: underline;
}
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f6f5f0;
            color: #253d34;
            font-family: "Microsoft YaHei", sans-serif;
        }

        main {
            max-width: 800px;
            margin: 48px auto;
            padding: 0 24px;
        }

        h1 { margin-bottom: 8px; }
        h2 { margin-top: 32px; }
        .subtitle { color: #68766e; }

        form, .card {
            background: white;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid #e1e6df;
            border-radius: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #bbc8bf;
            border-radius: 8px;
            font: inherit;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #315e49;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .card h3 { margin: 0 0 12px; overflow-wrap: anywhere; }
        .card p { margin: 0; color: #68766e; }

        select {
    padding: 10px 14px;
    border: 1px solid #bbc8bf;
    border-radius: 8px;
    background: white;
    color: #253d34;
    font: inherit;
    margin-bottom: 12px;
}
    </style>
</head>
<body>
    <main>
        <h1>留白 LessLab</h1>
        <p class="subtitle">把收藏，变成行动。</p>

        <h2>新增收藏</h2>
        <form id="resource-form">
            <label for="title">收藏标题</label>
            <input
                id="title"
                type="text"
                maxlength="200"
                placeholder="例如：Python 函数入门"
                required
            >

            <label for="url">内容链接</label>
            <input
                id="url"
                type="url"
                placeholder="https://..."
                required
            >

            <label for="estimated-minutes">预计学习时长（分钟，可不填）</label>
<input
    id="estimated-minutes"
    type="number"
    min="1"
    max="600"
    step="1"
    placeholder="例如：20；不知道可以留空"
>
            <button id="save-button" type="submit">保存收藏</button>
            <p id="form-message" role="status"></p>
        </form>

        <h2>AI 学习计划</h2>

<form id="ai-plan-form">
    <label for="ai-goal">你想学会什么？</label>
    <textarea
        id="ai-goal"
        rows="3"
        minlength="2"
        maxlength="500"
        placeholder="例如：我想掌握 Python 函数的参数和返回值"
        required
    ></textarea>

    <label for="ai-minutes">今天可以学习多久？（分钟）</label>
    <input
        id="ai-minutes"
        type="number"
        min="1"
        max="600"
        step="1"
        value="30"
        required
    >

    <p class="subtitle">
        根据收藏标题和预计时长生成建议。
        你的学习目标及候选收藏的标题、时长会发送给 DeepSeek。
    </p>

    <button id="ai-plan-button" type="submit">
        生成 AI 计划
    </button>

    <p id="ai-plan-message" role="status"></p>
    <p id="ai-plan-usage" class="subtitle"></p>
</form>

<div id="ai-plan-list"></div>
        <h2>今日学习计划</h2>

<form id="plan-form">
    <label for="plan-minutes">今天可以学习多久？（分钟）</label>
    <input
        id="plan-minutes"
        type="number"
        min="1"
        max="600"
        step="1"
        value="30"
        required
    >

    <p class="subtitle">
        从时长已填写的待学习收藏中，优先安排短任务。
    </p>

    <button id="plan-button" type="submit">生成计划</button>
    <p id="plan-message" role="status"></p>
</form>

<div id="plan-list"></div>

        <h2>我的收藏</h2>
        <form id="search-form">
    <label for="search-input">搜索收藏标题</label>
    <input
        id="search-input"
        type="search"
        maxlength="200"
        placeholder="输入关键词，例如 Python"
    >
    <button type="submit">搜索</button>
</form>
        <label for="status-filter">查看范围</label>
<select id="status-filter">
    <option value="all">全部收藏</option>
    <option value="unread">待学习</option>
    <option value="done">已完成</option>
</select>
        <p id="list-message" role="status">正在读取收藏……</p>
        <div id="resource-list"></div>
    </main>

    <script>
        const form = document.getElementById("resource-form");
        const saveButton = document.getElementById("save-button");
        const formMessage = document.getElementById("form-message");
        const statusFilter = document.getElementById("status-filter");
        const searchForm = document.getElementById("search-form");
const searchInput = document.getElementById("search-input");

searchForm.addEventListener("submit", function (event) {
    event.preventDefault();
    loadResources();
});

statusFilter.addEventListener("change", function () {
    loadResources();
});

        // 从后端读取收藏，然后生成卡片。
        async function loadResources() {
            const message = document.getElementById("list-message");
            const list = document.getElementById("resource-list");

            try {
                const response = await fetch("/resources");

                if (!response.ok) {
                    throw new Error("读取失败");
                }

                const data = await response.json();

                // 清除旧卡片，避免重新加载时重复显示。
                list.replaceChildren();

const selectedStatus = statusFilter.value;
const keyword = searchInput.value.trim().toLowerCase();

const filteredResources = data.items.filter(function (resource) {
    const matchesStatus =
        selectedStatus === "all" ||
        resource.status === selectedStatus;

    const matchesKeyword =
        resource.title.toLowerCase().includes(keyword);

    return matchesStatus && matchesKeyword;
});

const unreadCount = data.items.filter(function (resource) {
    return resource.status === "unread";
}).length;

const doneCount = data.items.filter(function (resource) {
    return resource.status === "done";
}).length;

message.textContent =
    `最近加载的 ${data.items.length} 条收藏中：` +
    `待学习 ${unreadCount} 条，已完成 ${doneCount} 条。` +
    `当前筛选显示 ${filteredResources.length} 条。`;

if (filteredResources.length === 0) {
    message.textContent += " 当前范围暂无收藏。";
}

               for (const resource of filteredResources) {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = resource.title;

    const isDone = resource.status === "done";

    const status = document.createElement("p");
    status.textContent = isDone
        ? "状态：已完成 ✓"
        : "状态：待学习";

    const button = document.createElement("button");
    button.type = "button";
    button.style.marginTop = "16px";
    button.textContent = isDone
        ? "改回待学习"
        : "标记已完成";

    button.addEventListener("click", async function () {
        button.disabled = true;
        button.textContent = "更新中……";
        formMessage.textContent = "";

        try {
            const response = await fetch(
                `/resources/${resource.id}/status`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        status: isDone ? "unread" : "done"
                    })
                }
            );

            if (!response.ok) {
                formMessage.textContent = "修改状态失败，请刷新页面后重试。";
                return;
            }

            formMessage.textContent = "收藏状态已更新！";
            await loadResources();
        } catch (error) {
            formMessage.textContent =
                "连接中断，请刷新页面确认状态后再重试。";
        } finally {
            button.disabled = false;
            button.textContent = isDone
                ? "改回待学习"
                : "标记已完成";
        }
    });

    const duration = document.createElement("p");
duration.style.marginTop = "8px";

duration.textContent = resource.estimated_minutes == null
    ? "预计时长：未填写"
    : `预计时长：${resource.estimated_minutes} 分钟`;

card.append(title, status, duration);

try {
    const originalUrl = new URL(resource.url);

    if (
        originalUrl.protocol === "https:" ||
        originalUrl.protocol === "http:"
    ) {
        const link = document.createElement("a");
        link.href = originalUrl.href;
        link.textContent = "打开原文 ↗";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "original-link";

        card.append(link);
    }
} catch (error) {
    // 链接格式有问题时，仍然正常显示收藏卡片。
}

card.append(button);
list.append(card);
}
            } catch (error) {
                message.textContent = "收藏列表加载失败，请刷新页面重试。";
            }
        }

        // 点击“保存收藏”时，把输入的内容提交给后端。
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const url = document.getElementById("url").value.trim();
            const minutesValue =
    document.getElementById("estimated-minutes").value;

const estimatedMinutes = minutesValue === ""
    ? null
    : Number(minutesValue);

            if (!title) {
                formMessage.textContent = "请输入标题，不能只填写空格。";
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "保存中……";
            formMessage.textContent = "";

            try {
                const response = await fetch("/resources", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
    title: title,
    url: url,
    estimated_minutes: estimatedMinutes
})
                });

                if (!response.ok) {
                    formMessage.textContent = response.status === 422
                        ? "请检查：标题不能为空，链接需以 http:// 或 https:// 开头，时长须为 1—600 的整数或留空。"
                        : "保存失败，请稍后重试。";
                    return;
                }

                form.reset();
                formMessage.textContent = "收藏已保存！";
                await loadResources();
            } catch (error) {
                formMessage.textContent =
                    "连接中断，暂时无法确认保存结果，请刷新查看后再决定是否重试。";
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "保存收藏";
            }
        });

        const planForm = document.getElementById("plan-form");
const planButton = document.getElementById("plan-button");
const planMessage = document.getElementById("plan-message");
const planList = document.getElementById("plan-list");

planForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const minutes = Number(
        document.getElementById("plan-minutes").value
    );

    planButton.disabled = true;
    planButton.textContent = "生成中……";
    planMessage.textContent = "";
    planList.replaceChildren();

    try {
        const response = await fetch(
            `/study-plan?minutes=${minutes}`
        );

        if (!response.ok) {
            throw new Error("生成计划失败");
        }

        const data = await response.json();

        if (data.items.length === 0) {
            planMessage.textContent =
                "当前没有符合条件的收藏。请检查是否有待学习、" +
                "已填写时长且不超过预算的内容。";
            return;
        }

        planMessage.textContent =
            `为你安排了 ${data.items.length} 项内容，` +
            `预计 ${data.total_minutes} 分钟，` +
            `剩余 ${data.remaining_minutes} 分钟。`;

        for (const [index, resource] of data.items.entries()) {
            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = `${index + 1}. ${resource.title}`;

            const duration = document.createElement("p");
            duration.textContent =
                `预计学习 ${resource.estimated_minutes} 分钟`;

            card.append(title, duration);

            try {
                const originalUrl = new URL(resource.url);

                if (
                    originalUrl.protocol === "https:" ||
                    originalUrl.protocol === "http:"
                ) {
                    const link = document.createElement("a");
                    link.href = originalUrl.href;
                    link.textContent = "开始学习 ↗";
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.className = "original-link";

                    card.append(link);
                }
            } catch (error) {
                // 链接异常时，仍显示任务标题和时长。
            }

            planList.append(card);
        }
    } catch (error) {
        planMessage.textContent =
            "暂时无法生成计划，请确认服务正在运行后重试。";
    } finally {
        planButton.disabled = false;
        planButton.textContent = "生成计划";
    }
});

        // 打开网页时，自动加载收藏。
        loadResources();
    </script>

    <script src="/static/ai_plan.js" defer></script>
</body>
</html>
